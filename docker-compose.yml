# Production stack (what runs on EC2).
# Locally, `docker compose` also loads docker-compose.override.yml, which
# switches the backend to live-reload dev mode and adds the frontend.
# On the server, ~/movie-db/.env sets COMPOSE_FILE=docker-compose.yml so the
# override is ignored (deploy/setup.sh writes it).

services:
  postgres:
    image: postgres:16
    container_name: movie_db_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: moviedb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No published port: only the backend (on the compose network) needs it.

  backend:
    build:
      context: ./backend
      target: production
    container_name: movie_db_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/moviedb
      PORT: 4000
    depends_on:
      - postgres
    ports:
      # localhost only: nginx on the host proxies to it
      - "127.0.0.1:4000:4000"
    env_file:
      - ./backend/.env

volumes:
  postgres_data:
