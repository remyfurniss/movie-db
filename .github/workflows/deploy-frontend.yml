name: Deploy Frontend

on:
  push:
    branches: [ "main" ]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  id-token: write # for AWS OIDC login
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::416911025278:role/movie-db-github-frontend-deploy
  S3_BUCKET: remy-movie-db-frontend
  CLOUDFRONT_DISTRIBUTION_ID: E1ZAY1D5L6W83T

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        run: |
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          # Hashed assets never change, so browsers can cache them for a year.
          # Old ones are kept so tabs still running the previous build keep working.
          aws s3 sync dist/assets "s3://$S3_BUCKET/assets" \
            --cache-control "public, max-age=31536000, immutable"
          # Everything else (index.html etc.) must be revalidated so new deploys show up.
          aws s3 sync dist/ "s3://$S3_BUCKET" --exclude "assets/*" --delete \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --paths "/*"
