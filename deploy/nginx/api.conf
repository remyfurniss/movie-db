# Reverse proxy for the backend container.
# HTTP only on purpose: setup.sh runs `certbot --nginx`, which adds the
# 443/SSL block and the HTTP -> HTTPS redirect to this file.
server {
    listen 80;
    server_name api.remyfurniss.com;

    location / {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
